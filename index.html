
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoLink</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b12;color:white;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:480px;background:#151520;border:1px solid #29293a;border-radius:18px;padding:30px}
h1{text-align:center;font-size:30px;margin:0}
h1 span{color:#8265ff}
p{text-align:center;color:#999;font-size:14px}
.area{border:2px dashed #48415e;border-radius:14px;padding:35px 15px;text-align:center;margin:25px 0}
.area label{display:block;cursor:pointer;color:#b6a7ff;font-weight:bold}
input{display:none}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#7655ed;color:white;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#status{text-align:center;margin:15px 0;color:#b6a7ff}
#resultado{display:none;margin-top:20px}
#link{width:100%;padding:12px;background:#0b0b12;border:1px solid #39394a;color:white;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<main>
<h1>Video<span>Link</span></h1>
<p>Envie seus vídeos e compartilhe com qualquer pessoa.</p>

<div class="area">
<label for="video">＋ Selecionar vídeo</label>
<input type="file" id="video" accept="video/*">
<p id="nome">Nenhum vídeo selecionado</p>
</div>

<button id="enviar">Enviar vídeo</button>
<div id="status"></div>

<div id="resultado">
<input id="link" readonly>
<button id="copiar">Copiar link</button>
</div>
</main>

<script>
const CLOUD_NAME="SEU_CLOUD_NAME";
const UPLOAD_PRESET="SEU_UPLOAD_PRESET";

const video=document.getElementById("video");
const enviar=document.getElementById("enviar");
const status=document.getElementById("status");
const resultado=document.getElementById("resultado");
const link=document.getElementById("link");

video.onchange=()=>{
document.getElementById("nome").textContent=video.files[0]?.name||"Nenhum vídeo selecionado";
};

enviar.onclick=async()=>{
const arquivo=video.files[0];

if(!arquivo)return alert("Selecione um vídeo primeiro!");

if(!CLOUD_NAME||CLOUD_NAME==="SEU_CLOUD_NAME"||!UPLOAD_PRESET||UPLOAD_PRESET==="SEU_UPLOAD_PRESET"){
return alert("Configure o armazenamento antes de enviar.");
}

enviar.disabled=true;
status.textContent="Enviando vídeo...";

try{
const dados=new FormData();
dados.append("file",arquivo);
dados.append("upload_preset",UPLOAD_PRESET);

const resposta=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,{
method:"POST",
body:dados
});

const info=await resposta.json();
if(!resposta.ok)throw new Error(info.error?.message||"Falha no envio");

link.value=info.secure_url;
resultado.style.display="block";
status.textContent="Vídeo enviado com sucesso!";
}catch(erro){
status.textContent="Erro: "+erro.message;
}finally{
enviar.disabled=false;
}
};

document.getElementById("copiar").onclick=async()=>{
await navigator.clipboard.writeText(link.value);
status.textContent="Link copiado!";
};
</script>
</body>
</html>
