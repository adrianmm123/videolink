
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoLink</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:#0b0b12;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
padding:24px;
}
.container{
width:100%;
max-width:560px;
background:#151520;
border:1px solid #29293b;
border-radius:22px;
padding:30px;
box-shadow:0 20px 70px #0008;
}
.header{text-align:center;margin-bottom:28px}
.logo{
width:55px;
height:55px;
margin:0 auto 15px;
border-radius:17px;
background:linear-gradient(135deg,#806cff,#543bd5);
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
font-weight:bold;
}
h1{margin:0;font-size:29px}
.header p{color:#9999ad;margin:10px 0 0;font-size:14px}
.drop-area{
border:2px dashed #41415a;
border-radius:16px;
padding:35px 18px;
text-align:center;
background:#1b1b29;
cursor:pointer;
transition:.2s;
}
.drop-area:hover,.drop-area.drag{
border-color:#8a78ff;
background:#222139;
}
.upload-icon{
font-size:38px;
margin-bottom:12px;
}
.drop-area h2{font-size:17px;margin:0 0 8px}
.drop-area p{font-size:13px;color:#9999ad;margin:0}
.choose{
display:inline-block;
margin-top:19px;
padding:11px 20px;
border-radius:9px;
background:#7562f5;
font-size:13px;
font-weight:bold;
}
#video{display:none}
.file-info{
display:none;
margin-top:17px;
padding:14px;
background:#20202e;
border:1px solid #333348;
border-radius:12px;
align-items:center;
gap:12px;
}
.file-icon{
width:42px;
height:42px;
border-radius:10px;
background:#302b55;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
flex-shrink:0;
}
.file-details{min-width:0;flex:1}
.file-name{
font-size:13px;
font-weight:bold;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}
.file-size{font-size:12px;color:#9999ad;margin-top:5px}
.remove{
background:none;
border:0;
color:#ff7777;
font-size:20px;
cursor:pointer;
padding:5px;
}
.preview{
display:none;
width:100%;
max-height:250px;
margin-top:15px;
border-radius:12px;
background:#000;
}
.main-button{
width:100%;
margin-top:20px;
padding:15px;
border:0;
border-radius:11px;
background:linear-gradient(135deg,#806cff,#5944dc);
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}
.main-button:hover{filter:brightness(1.12)}
.main-button:disabled{opacity:.5;cursor:not-allowed}
.progress-area{display:none;margin-top:22px}
.progress-top{
display:flex;
justify-content:space-between;
font-size:13px;
margin-bottom:10px;
}
#percent{color:#a99cff;font-weight:bold}
.progress-bg{
height:9px;
background:#303044;
border-radius:20px;
overflow:hidden;
}
#progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#806cff,#b49cff);
border-radius:20px;
transition:width .15s;
}
#status{
margin-top:12px;
font-size:13px;
color:#aaaabd;
text-align:center;
overflow-wrap:anywhere;
}
.result{
display:none;
margin-top:22px;
padding:17px;
border:1px solid #34334c;
background:#1d1d2b;
border-radius:13px;
}
.success{
color:#79e6a2;
font-weight:bold;
font-size:14px;
margin-bottom:12px;
}
#link{
font-size:12px;
color:#b9b1ff;
overflow-wrap:anywhere;
line-height:1.6;
}
.copy-button{
width:100%;
margin-top:14px;
padding:12px;
border:0;
border-radius:9px;
background:#302b55;
color:white;
font-weight:bold;
cursor:pointer;
}
.footer{
text-align:center;
color:#66667a;
font-size:11px;
margin-top:25px;
}
@media(max-width:480px){
.container{padding:22px}
h1{font-size:25px}
.drop-area{padding:28px 12px}
}
</style>
</head>
<body>

<div class="container">

<div class="header">
<div class="logo">V</div>
<h1>VideoLink</h1>
<p>Envie seus vídeos e compartilhe com quem quiser.</p>
</div>

<div class="drop-area" id="dropArea">
<div class="upload-icon">☁️</div>
<h2>Arraste seu vídeo até aqui</h2>
<p>Ou selecione um arquivo do seu dispositivo</p>
<label class="choose" for="video">Escolher vídeo</label>
<input type="file" id="video" accept="video/mp4,video/quicktime,video/webm">
</div>

<div class="file-info" id="fileInfo">
<div class="file-icon">▶</div>
<div class="file-details">
<div class="file-name" id="fileName"></div>
<div class="file-size" id="fileSize"></div>
</div>
<button class="remove" id="remove" title="Remover vídeo">×</button>
</div>

<video class="preview" id="preview" controls></video>

<button class="main-button" id="upload" disabled>Enviar vídeo</button>

<div class="progress-area" id="progressArea">
<div class="progress-top">
<span id="progressText">Enviando vídeo...</span>
<span id="percent">0%</span>
</div>
<div class="progress-bg">
<div id="progress"></div>
</div>
</div>

<div id="status"></div>

<div class="result" id="result">
<div class="success">✓ Vídeo enviado com sucesso!</div>
<div id="link"></div>
<button class="copy-button" id="copy">Copiar link</button>
</div>

<div class="footer">
VideoLink · Compartilhe seus vídeos facilmente
</div>

</div>

<script>
const CLOUD_NAME="nkqmkka9";
const UPLOAD_PRESET="videolink_upload";
const MAX_SIZE=1024*1024*1024;
const CHUNK_SIZE=20*1024*1024;

const video=document.getElementById("video");
const dropArea=document.getElementById("dropArea");
const fileInfo=document.getElementById("fileInfo");
const fileName=document.getElementById("fileName");
const fileSize=document.getElementById("fileSize");
const preview=document.getElementById("preview");
const upload=document.getElementById("upload");
const remove=document.getElementById("remove");
const status=document.getElementById("status");
const progressArea=document.getElementById("progressArea");
const progress=document.getElementById("progress");
const percent=document.getElementById("percent");
const progressText=document.getElementById("progressText");
const result=document.getElementById("result");
const link=document.getElementById("link");
const copy=document.getElementById("copy");

let selectedFile=null;
let previewURL=null;

function formatSize(bytes){
if(bytes>=1024*1024*1024)return (bytes/(1024*1024*1024)).toFixed(2)+" GB";
return (bytes/(1024*1024)).toFixed(2)+" MB";
}

function selectFile(file){
if(!file)return;

const extension=file.name.split(".").pop().toLowerCase();

if(!["mp4","mov","webm"].includes(extension)){
status.textContent="Formato não permitido. Use MP4, MOV ou WEBM.";
return;
}

if(file.size>MAX_SIZE){
status.textContent="O vídeo ultrapassa o limite de 1 GB.";
return;
}

selectedFile=file;
fileName.textContent=file.name;
fileSize.textContent=formatSize(file.size);
fileInfo.style.display="flex";
upload.disabled=false;
status.textContent="";
result.style.display="none";
progressArea.style.display="none";
progress.style.width="0%";
percent.textContent="0%";

if(previewURL)URL.revokeObjectURL(previewURL);
previewURL=URL.createObjectURL(file);
preview.src=previewURL;
preview.style.display="block";
}

video.addEventListener("change",()=>{
selectFile(video.files[0]);
});

dropArea.addEventListener("click",()=>{
video.click();
});

dropArea.addEventListener("dragover",e=>{
e.preventDefault();
dropArea.classList.add("drag");
});

dropArea.addEventListener("dragleave",()=>{
dropArea.classList.remove("drag");
});

dropArea.addEventListener("drop",e=>{
e.preventDefault();
dropArea.classList.remove("drag");
selectFile(e.dataTransfer.files[0]);
});

remove.addEventListener("click",()=>{
selectedFile=null;
video.value="";
fileInfo.style.display="none";
preview.style.display="none";
preview.removeAttribute("src");
upload.disabled=true;
status.textContent="";
result.style.display="none";
progressArea.style.display="none";
if(previewURL)URL.revokeObjectURL(previewURL);
previewURL=null;
});

function sendChunk(blob,start,end,total,uploadId){
return new Promise((resolve,reject)=>{
const xhr=new XMLHttpRequest();
const data=new FormData();

data.append("file",blob);
data.append("upload_preset",UPLOAD_PRESET);

xhr.open("POST",
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`);

xhr.setRequestHeader("X-Unique-Upload-Id",uploadId);
xhr.setRequestHeader("Content-Range",`bytes ${start}-${end}/${total}`);

xhr.onload=()=>{
let response;

try{
response=JSON.parse(xhr.responseText);
}catch{
reject(new Error("Resposta inválida da Cloudinary."));
return;
}

if(xhr.status>=200&&xhr.status<300){
resolve(response);
}else{
reject(new Error(response.error?.message||"Falha no envio."));
}
};

xhr.onerror=()=>reject(new Error("Erro de conexão durante o envio."));
xhr.onabort=()=>reject(new Error("Envio interrompido."));

xhr.send(data);
});
}

upload.addEventListener("click",async()=>{
if(!selectedFile)return;

upload.disabled=true;
video.disabled=true;
remove.disabled=true;
result.style.display="none";
progressArea.style.display="block";
status.textContent="Preparando envio...";
progressText.textContent="Enviando vídeo...";

const file=selectedFile;
const uploadId=crypto.randomUUID();
let finalResult=null;

try{
for(let start=0;start<file.size;start+=CHUNK_SIZE){
const end=Math.min(start+CHUNK_SIZE,file.size)-1;
const chunk=file.slice(start,end+1);

status.textContent="Enviando parte "+(Math.floor(start/CHUNK_SIZE)+1)+" do vídeo...";

const xhrPromise=sendChunk(chunk,start,end,file.size,uploadId);

const response=await xhrPromise;

if(response.done===true||end===file.size-1){
finalResult=response;
}

const current=end+1;
const percentage=Math.round((current/file.size)*100);

progress.style.width=percentage+"%";
percent.textContent=percentage+"%";
}

if(!finalResult||!finalResult.secure_url){
throw new Error("O envio terminou, mas o link não foi recebido.");
}

link.textContent=finalResult.secure_url;
result.style.display="block";
status.textContent="";
progressText.textContent="Envio concluído";
progress.style.width="100%";
percent.textContent="100%";

}catch(error){
status.textContent="Erro: "+error.message;
progressText.textContent="Não foi possível concluir";
}finally{
upload.disabled=false;
video.disabled=false;
remove.disabled=false;
}
});

copy.addEventListener("click",async()=>{
try{
await navigator.clipboard.writeText(link.textContent);
copy.textContent="Link copiado!";
setTimeout(()=>copy.textContent="Copiar link",2000);
}catch{
status.textContent="Não foi possível copiar. Selecione e copie o link manualmente.";
}
});
</script>

</body>
</html>
