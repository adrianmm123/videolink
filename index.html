
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoLink</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#101018;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px
}
.container{
width:100%;
max-width:480px;
background:#1b1b28;
padding:30px;
border-radius:16px;
text-align:center;
box-shadow:0 10px 35px #0005
}
h1{margin-top:0;color:#8b7cff}
p{color:#aaa}
input[type=file]{
width:100%;
margin:20px 0;
padding:12px;
background:#29293a;
border-radius:8px;
color:white
}
button{
width:100%;
padding:14px;
border:0;
border-radius:8px;
background:#7565f5;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:18px;overflow-wrap:anywhere}
#link{
display:none;
margin-top:15px;
padding:12px;
background:#29293a;
border-radius:8px;
overflow-wrap:anywhere
}
#copy{margin-top:10px;display:none}
</style>
</head>
<body>

<div class="container">
<h1>VideoLink</h1>
<p>Envie seu vídeo e compartilhe o link com outras pessoas.</p>

<input type="file" id="video" accept="video/mp4,video/quicktime,video/webm">

<button id="upload">Enviar vídeo</button>

<div id="status"></div>

<div id="link"></div>

<button id="copy">Copiar link</button>
</div>

<script>
const CLOUD_NAME="nkqmkka9";
const UPLOAD_PRESET="videolink_upload";

const video=document.getElementById("video");
const upload=document.getElementById("upload");
const status=document.getElementById("status");
const link=document.getElementById("link");
const copy=document.getElementById("copy");

upload.addEventListener("click",async()=>{
const file=video.files[0];

if(!file){
status.textContent="Selecione um vídeo primeiro.";
return;
}

if(file.size>50*1024*1024){
status.textContent="O vídeo deve ter no máximo 50 MB.";
return;
}

if(!["video/mp4","video/quicktime","video/webm"].includes(file.type)){
status.textContent="Formato não permitido. Use MP4, MOV ou WEBM.";
return;
}

upload.disabled=true;
status.textContent="Enviando vídeo...";
link.style.display="none";
copy.style.display="none";

try{
const data=new FormData();
data.append("file",file);
data.append("upload_preset",UPLOAD_PRESET);

const response=await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
{
method:"POST",
body:data
}
);

const result=await response.json();

if(!response.ok){
throw new Error(result.error?.message||"Erro ao enviar vídeo.");
}

link.textContent=result.secure_url;
link.style.display="block";
copy.style.display="block";
status.textContent="Vídeo enviado com sucesso!";

}catch(error){
status.textContent="Erro: "+error.message;
}finally{
upload.disabled=false;
}
});

copy.addEventListener("click",async()=>{
try{
await navigator.clipboard.writeText(link.textContent);
copy.textContent="Copiado!";
setTimeout(()=>copy.textContent="Copiar link",2000);
}catch{
status.textContent="Não foi possível copiar automaticamente.";
}
});
</script>

</body>
</html>
